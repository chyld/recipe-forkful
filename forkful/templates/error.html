{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main_class %}page page-error{% endblock %}
{% block content %}
<div class="error-card card flavor-{{ code % 7 }}">
  <div class="washi" aria-hidden="true"></div>
  <p class="error-emoji" aria-hidden="true">{{ emoji }}</p>
  <h1 class="display">{{ title }}</h1>
  <p class="lede">{{ message }}</p>
  <p class="error-code">Error {{ code }}</p>
  <p><a class="btn btn-mint" href="{{ url_for('recipes.index') }}">Back to my recipes</a></p>
</div>
{% endblock %}
